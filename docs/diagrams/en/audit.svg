<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="Every action leaves one redacted line">
<title>Every action leaves one redacted line</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="440" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">Every action leaves one redacted line</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">Refusals are recorded too, so an empty transcript always has a reason</text>
<rect x="40" y="96" width="470" height="250" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">One entry, seven fields</text><line x1="62" y1="140" x2="488" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text class="mono" x="62" y="168" font-size="12" fill="#4fb6f0" font-weight="400" text-anchor="start">at</text><text x="150" y="168" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">when it happened</text><text class="mono" x="62" y="192" font-size="12" fill="#4fb6f0" font-weight="400" text-anchor="start">cmd</text><text x="150" y="192" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">the rc.* command that ran</text><text class="mono" x="62" y="216" font-size="12" fill="#4fb6f0" font-weight="400" text-anchor="start">level</text><text x="150" y="216" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">capability risk level</text><text class="mono" x="62" y="240" font-size="12" fill="#4fb6f0" font-weight="400" text-anchor="start">ok</text><text x="150" y="240" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">true / false</text><text class="mono" x="62" y="264" font-size="12" fill="#4fb6f0" font-weight="400" text-anchor="start">code</text><text x="150" y="264" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">refusal reason, when refused</text><text class="mono" x="62" y="288" font-size="12" fill="#4fb6f0" font-weight="400" text-anchor="start">args</text><text x="150" y="288" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">redacted before it is stored</text><text class="mono" x="62" y="312" font-size="12" fill="#4fb6f0" font-weight="400" text-anchor="start">ms</text><text x="150" y="312" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">gate + execution time</text><rect x="530" y="96" width="470" height="250" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="552" y="126" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">What the stored arguments become</text><line x1="552" y1="140" x2="978" y2="140" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text class="mono" x="552" y="168" font-size="11" fill="#708993" font-weight="400" text-anchor="start">body: &quot;482913&quot;</text><text class="mono" x="552" y="188" font-size="11.5" fill="#7bf0d0" font-weight="400" text-anchor="start">body: &lt;redacted:6&gt;</text><text class="mono" x="552" y="212" font-size="11" fill="#708993" font-weight="400" text-anchor="start">number: &quot;+8613800000000&quot;</text><text class="mono" x="552" y="232" font-size="11.5" fill="#7bf0d0" font-weight="400" text-anchor="start">number: &lt;redacted:14&gt;</text><text class="mono" x="552" y="256" font-size="11" fill="#708993" font-weight="400" text-anchor="start">path: &quot;/sdcard/DCIM/IMG_2041.jpg&quot;</text><text class="mono" x="552" y="276" font-size="11.5" fill="#7bf0d0" font-weight="400" text-anchor="start">path: &lt;redacted:26&gt;</text><text class="mono" x="552" y="300" font-size="11" fill="#708993" font-weight="400" text-anchor="start">tags: [&quot;a&quot;, &quot;b&quot;, &quot;c&quot;]</text><text class="mono" x="552" y="320" font-size="11.5" fill="#7bf0d0" font-weight="400" text-anchor="start">tags: &lt;array:3&gt;</text><rect x="40" y="364" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="398" font-size="12" fill="#7bf0d0" font-weight="400" text-anchor="start">The log keeps the last 200 entries on the phone; nothing about it is uploaded to the desktop.</text>
</svg>
