<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="352" viewBox="0 0 1040 352" role="img" aria-label="One device action, six gates">
<title>One device action, six gates</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="352" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">One device action, six gates</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">Every rc.* command walks the same path before it can touch the phone</text>
<circle cx="60" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="60" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">1</text><line x1="78" y1="126" x2="196" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="40" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">Intent</text><text x="40" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">desktop builds a</text><text x="40" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">typed rc.* call</text><circle cx="224" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="224" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">2</text><line x1="242" y1="126" x2="360" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="204" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">Allowlist</text><text x="204" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">types, ranges and</text><text x="204" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">paths are checked</text><circle cx="388" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="388" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">3</text><line x1="406" y1="126" x2="524" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="368" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">Capability</text><text x="368" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">the command belongs</text><text x="368" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">to exactly one group</text><circle cx="552" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="552" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">4</text><line x1="570" y1="126" x2="688" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="532" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">Risk ceiling</text><text x="532" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">critical needs an</text><text x="532" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">explicit confirmation</text><circle cx="716" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="716" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">5</text><line x1="734" y1="126" x2="852" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="696" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">Rate limit</text><text x="696" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">per-minute budget</text><text x="696" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">per capability</text><circle cx="880" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="880" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">6</text><text x="860" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">Audit</text><text x="860" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">redacted entry:</text><text x="860" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">result, level, ms</text><rect x="40" y="262" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="296" font-size="12.5" fill="#7bf0d0" font-weight="400" text-anchor="start">Unknown commands are rejected, never guessed. Refusals are audited too.</text>
</svg>
