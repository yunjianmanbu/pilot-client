<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="Three products, three directions of control">
<title>Three products, three directions of control</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="420" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">Three products, three directions of control</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">Same design language; the difference is who drives whom</text>
<rect x="40" y="96" width="306" height="214" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="124" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">PILOT</text><line x1="62" y1="138" x2="324" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text class="mono" x="62" y="166" font-size="14" fill="#4fb6f0" font-weight="400" text-anchor="start">person → computer</text><text x="62" y="200" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">You drive the agent on your</text><text x="62" y="220" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">desktop, inside a local folder.</text><text x="62" y="282" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">dark, white P, green dot</text><rect x="367" y="96" width="306" height="214" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="389" y="124" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">PILOT LINK</text><line x1="389" y1="138" x2="651" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text class="mono" x="389" y="166" font-size="14" fill="#4fb6f0" font-weight="400" text-anchor="start">phone → computer</text><text x="389" y="200" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">Your phone reads sessions, continues</text><text x="389" y="220" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">chats and approves tool calls.</text><text x="389" y="282" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">green, white P, white dot</text><rect x="694" y="96" width="306" height="214" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="716" y="124" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">PILOT CLIENT</text><line x1="716" y1="138" x2="978" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text class="mono" x="716" y="166" font-size="14" fill="#4fb6f0" font-weight="400" text-anchor="start">computer → phone</text><text x="716" y="200" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">The desktop operates this phone:</text><text x="716" y="220" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">screen, taps, notifications, files.</text><text x="716" y="282" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">white, black P, black dot</text><rect x="40" y="330" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="364" font-size="12.5" fill="#7bf0d0" font-weight="400" text-anchor="start">Pilot Client is the only one of the three where the desktop holds authority over a device.</text>
</svg>
