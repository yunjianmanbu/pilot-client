<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-label="三个产品，三个控制方向">
<title>三个产品，三个控制方向</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="420" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">三个产品，三个控制方向</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">同一套设计语言，区别在于谁控制谁</text>
<rect x="40" y="96" width="306" height="214" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="62" y="124" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">PILOT</text><line x1="62" y1="138" x2="324" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text class="mono" x="62" y="166" font-size="14" fill="#4fb6f0" font-weight="400" text-anchor="start">人 → 电脑</text><text x="62" y="200" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">你在桌面上驱动智能体，</text><text x="62" y="220" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">执行环境就是本地文件夹。</text><text x="62" y="282" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">深色，白 P，绿点</text><rect x="367" y="96" width="306" height="214" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="389" y="124" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">PILOT LINK</text><line x1="389" y1="138" x2="651" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text class="mono" x="389" y="166" font-size="14" fill="#4fb6f0" font-weight="400" text-anchor="start">手机 → 电脑</text><text x="389" y="200" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">用手机看会话、接着聊、</text><text x="389" y="220" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">批准工具调用。</text><text x="389" y="282" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">绿色，白 P，白点</text><rect x="694" y="96" width="306" height="214" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="716" y="124" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1.2">PILOT CLIENT</text><line x1="716" y1="138" x2="978" y2="138" stroke="rgba(154,202,218,0.20)" stroke-width="1"/><text class="mono" x="716" y="166" font-size="14" fill="#4fb6f0" font-weight="400" text-anchor="start">电脑 → 手机</text><text x="716" y="200" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">桌面端操作这台手机：</text><text x="716" y="220" font-size="12.5" fill="#9cb2bb" font-weight="400" text-anchor="start">屏幕、点击、通知、文件。</text><text x="716" y="282" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">白色，黑 P，黑点</text><rect x="40" y="330" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="364" font-size="12.5" fill="#7bf0d0" font-weight="400" text-anchor="start">三者之中，只有 Pilot Client 是桌面端对一台设备持有权限。</text>
</svg>
