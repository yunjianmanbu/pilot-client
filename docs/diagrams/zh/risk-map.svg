<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-label="十二个能力组，四个风险级">
<title>十二个能力组，四个风险级</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="410" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">十二个能力组，四个风险级</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">风险越高，门槛越严——而不是默认更安静</text>
<rect x="40" y="100" width="232" height="200" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><rect x="58" y="112" width="8" height="8" rx="2" fill="#7bf0d0"/><text x="74" y="121" font-size="11.5" fill="#7bf0d0" font-weight="600" text-anchor="start" letter-spacing="1">低</text><text x="254" y="121" font-size="11.5" fill="#708993" font-weight="400" text-anchor="end">1</text><text x="58" y="152" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">连接与保活</text><text x="58" y="276" font-size="11" fill="#708993" font-weight="400" text-anchor="start">配对即授权</text><rect x="288" y="100" width="232" height="200" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><rect x="306" y="112" width="8" height="8" rx="2" fill="#4fb6f0"/><text x="322" y="121" font-size="11.5" fill="#4fb6f0" font-weight="600" text-anchor="start" letter-spacing="1">中</text><text x="502" y="121" font-size="11.5" fill="#708993" font-weight="400" text-anchor="end">3</text><text x="306" y="152" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">通知与状态栏</text><text x="306" y="176" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">传感器与活动识别</text><text x="306" y="200" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">日历与日程</text><text x="306" y="276" font-size="11" fill="#708993" font-weight="400" text-anchor="start">首次使用需确认</text><rect x="536" y="100" width="232" height="200" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><rect x="554" y="112" width="8" height="8" rx="2" fill="#f0b866"/><text x="570" y="121" font-size="11.5" fill="#f0b866" font-weight="600" text-anchor="start" letter-spacing="1">高</text><text x="750" y="121" font-size="11.5" fill="#708993" font-weight="400" text-anchor="end">4</text><text x="554" y="152" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">应用管理</text><text x="554" y="176" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">文件与媒体</text><text x="554" y="200" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">定位</text><text x="554" y="224" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">设备控制</text><text x="554" y="276" font-size="11" fill="#708993" font-weight="400" text-anchor="start">每次调用都确认</text><rect x="784" y="100" width="232" height="200" rx="14" fill="#0b141c" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><rect x="802" y="112" width="8" height="8" rx="2" fill="#f0796e"/><text x="818" y="121" font-size="11.5" fill="#f0796e" font-weight="600" text-anchor="start" letter-spacing="1">严重</text><text x="998" y="121" font-size="11.5" fill="#708993" font-weight="400" text-anchor="end">4</text><text x="802" y="152" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">屏幕镜像与输入注入</text><text x="802" y="176" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">通讯录与通话</text><text x="802" y="200" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">短信</text><text x="802" y="224" font-size="12" fill="#9cb2bb" font-weight="400" text-anchor="start">相机与麦克风</text><text x="802" y="276" font-size="11" fill="#708993" font-weight="400" text-anchor="start">每次调用都确认，绝不静默</text><rect x="40" y="320" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="354" font-size="12.5" fill="#7bf0d0" font-weight="400" text-anchor="start">缺少权限的能力一律返回 not_granted 与提示，不假装成功。</text>
</svg>
