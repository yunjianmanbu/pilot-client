<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="352" viewBox="0 0 1040 352" role="img" aria-label="一次设备动作，六道关卡">
<title>一次设备动作，六道关卡</title>
<style>text{font-family:-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;}.mono{font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Consolas,monospace;}</style>
<rect width="1040" height="352" rx="16" fill="#060a0f"/>
<text x="40" y="40" font-size="17" fill="#e9f4f4" font-weight="600" text-anchor="start">一次设备动作，六道关卡</text>
<text x="40" y="62" font-size="12.5" fill="#708993" font-weight="400" text-anchor="start">每条 rc.* 命令都要走同一条路径，才可能碰到手机</text>
<circle cx="60" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="60" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">1</text><line x1="78" y1="126" x2="196" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="40" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">意图</text><text x="40" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">桌面端构造一条</text><text x="40" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">带类型的 rc.* 调用</text><circle cx="224" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="224" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">2</text><line x1="242" y1="126" x2="360" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="204" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">白名单</text><text x="204" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">类型、范围、路径</text><text x="204" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">逐项校验</text><circle cx="388" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="388" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">3</text><line x1="406" y1="126" x2="524" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="368" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">能力归属</text><text x="368" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">每条命令只属于</text><text x="368" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">一个能力组</text><circle cx="552" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="552" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">4</text><line x1="570" y1="126" x2="688" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="532" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">风险上限</text><text x="532" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">critical 必须</text><text x="532" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">逐次显式确认</text><circle cx="716" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="716" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">5</text><line x1="734" y1="126" x2="852" y2="126" stroke="rgba(154,202,218,0.20)" stroke-width="1.2"/><text x="696" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">限流</text><text x="696" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">每个能力有</text><text x="696" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">每分钟预算</text><circle cx="880" cy="126" r="14" fill="#081018" stroke="#7bf0d0" stroke-width="1.4"/><text class="mono" x="880" y="131" font-size="12" fill="#7bf0d0" font-weight="600" text-anchor="middle">6</text><text x="860" y="176" font-size="13" fill="#e9f4f4" font-weight="600" text-anchor="start">审计</text><text x="860" y="200" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">脱敏记录：结果、</text><text x="860" y="218" font-size="11.5" fill="#708993" font-weight="400" text-anchor="start">等级、耗时</text><rect x="40" y="262" width="960" height="56" rx="14" fill="#081018" stroke="rgba(123,240,208,0.32)" stroke-width="1.2"/><text x="60" y="296" font-size="12.5" fill="#7bf0d0" font-weight="400" text-anchor="start">未知命令一律拒绝，不做猜测；被拒绝的动作同样写进审计。</text>
</svg>
